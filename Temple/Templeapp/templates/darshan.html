{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Darshan Booking</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            background:linear-gradient(
                135deg,
                #fff5e6,
                #ffe0b3
            );

            min-height:100vh;

            padding:40px;

        }

        /* MAIN BOX */

        .booking-container{

            max-width:1100px;

            margin:auto;

            background:white;

            border-radius:30px;

            overflow:hidden;

            box-shadow:0 20px 50px rgba(0,0,0,0.15);

            display:grid;

            grid-template-columns:1fr 1fr;

        }

        /* LEFT IMAGE */

        .left-side{

            position:relative;

        }

        .left-side img{

            width:100%;

            height:100%;

            object-fit:cover;

        }

        .overlay{

            position:absolute;

            inset:0;

            background:rgba(0,0,0,0.4);

            display:flex;

            justify-content:center;

            align-items:center;

            text-align:center;

            padding:30px;

        }

        .overlay h1{

            color:white;

            font-size:42px;

            line-height:60px;

        }

        /* RIGHT FORM */

        .right-side{

            padding:50px;

        }

        .right-side h2{

            color:#8b2500;

            margin-bottom:10px;

            font-size:34px;

        }

        .right-side p{

            color:#666;

            margin-bottom:30px;

        }

        /* FORM */

        .form-group{

            margin-bottom:22px;

        }

        .form-group label{

            display:block;

            margin-bottom:10px;

            font-weight:600;

            color:#444;

        }

        .form-group input,
        .form-group select{

            width:100%;

            padding:15px;

            border:2px solid #ffd27f;

            border-radius:12px;

            outline:none;

            font-size:15px;

        }

        .form-group input:focus,
        .form-group select:focus{

            border-color:#ff9800;

            box-shadow:0 0 12px rgba(255,152,0,0.3);

        }

        /* BOOK BUTTON */

        .book-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                #b45309,
                #ea580c
            );

            color:white;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;

        }

        .book-btn:hover{

            transform:translateY(-2px);

            box-shadow:0 10px 20px rgba(0,0,0,0.2);

        }

        /* RESPONSIVE */

        @media(max-width:900px){

            .booking-container{

                grid-template-columns:1fr;

            }

            .left-side{

                height:300px;

            }

        }

        @media(max-width:500px){

            body{

                padding:15px;

            }

            .right-side{

                padding:30px;

            }

            .overlay h1{

                font-size:30px;

                line-height:45px;

            }

        }

    </style>

</head>

<body>

    <div class="booking-container">

        <!-- LEFT IMAGE -->

        <div class="left-side">

            <img src="{% static 'darshan-banner.jpg' %}"
                 alt="Temple">

            <div class="overlay">

                <h1>

                    Divine Darshan
                    Booking Portal

                </h1>

            </div>

        </div>

        <!-- RIGHT FORM -->

        <div class="right-side">

            <h2>Book Darshan</h2>

            <p>

                Select your preferred darshan date
                and timing for temple visit

            </p>

            <form>

                <!-- DEVOTEE NAME -->

                <div class="form-group">

                    <label>Full Name</label>

                    <input type="text"
                           placeholder="Enter Full Name">

                </div>

                <!-- MOBILE -->

                <div class="form-group">

                    <label>Mobile Number</label>

                    <input type="text"
                           placeholder="Enter Mobile Number">

                </div>

                <!-- DARSHAN TYPE -->

                <div class="form-group">

                    <label>Darshan Type</label>

                    <select>

                        <option>
                            Special Entry Darshan
                        </option>

                        <option>
                            Free Darshan
                        </option>

                        <option>
                            VIP Break Darshan
                        </option>

                    </select>

                </div>

                <!-- CALENDAR -->

                <div class="form-group">

                    <label>Select Date</label>

                    <input type="date">

                </div>

                <!-- SLOT -->

                <div class="form-group">

                    <label>Select Time Slot</label>

                    <select>

                        <option>
                            6:00 AM - 8:00 AM
                        </option>

                        <option>
                            8:00 AM - 10:00 AM
                        </option>

                        <option>
                            10:00 AM - 12:00 PM
                        </option>

                        <option>
                            4:00 PM - 6:00 PM
                        </option>

                    </select>

                </div>

                <button class="book-btn">

                    Confirm Booking

                </button>

            </form>

        </div>

    </div>

</body>

</html>
