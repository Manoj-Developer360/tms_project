{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #fff5e6,
                #ffe0b3
            );

            overflow:hidden;

        }

        /* BACKGROUND GLOW */

        body::before{

            content:"";

            position:absolute;

            width:500px;

            height:500px;

            background:#ffb347;

            border-radius:50%;

            filter:blur(180px);

            top:-100px;

            left:-100px;

            opacity:0.5;

        }

        body::after{

            content:"";

            position:absolute;

            width:400px;

            height:400px;

            background:#ff7b00;

            border-radius:50%;

            filter:blur(180px);

            bottom:-120px;

            right:-120px;

            opacity:0.3;

        }

        /* OTP CARD */

        .otp-container{

            position:relative;

            z-index:10;

        }

        .otp-card{

            width:420px;

            background:rgba(255,255,255,0.95);

            backdrop-filter:blur(10px);

            padding:45px;

            border-radius:28px;

            text-align:center;

            box-shadow:0 20px 50px rgba(0,0,0,0.2);

            border:1px solid rgba(255,255,255,0.4);

        }

        /* LOGO */

        .otp-logo{

            width:120px;

            height:120px;

            object-fit:contain;

            margin-bottom:20px;

            animation:float 3s ease-in-out infinite;

        }

        @keyframes float{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-8px);
            }

            100%{
                transform:translateY(0px);
            }

        }

        /* TITLE */

        .otp-card h2{

            color:#8b2500;

            font-size:34px;

            margin-bottom:10px;

            font-weight:700;

        }

        .otp-text{

            color:#666;

            font-size:15px;

            line-height:24px;

            margin-bottom:25px;

        }

        /* MESSAGE */

        .error-msg{

            background:#fff0f0;

            color:#d10000;

            padding:12px;

            border-radius:12px;

            margin-bottom:18px;

            font-size:14px;

            font-weight:600;

        }

        /* INPUT */

        .otp-card input{

            width:100%;

            padding:16px;

            border:2px solid #ffd27f;

            border-radius:14px;

            outline:none;

            font-size:16px;

            margin-bottom:20px;

            transition:0.3s;

        }

        .otp-card input:focus{

            border-color:#ff9800;

            box-shadow:0 0 15px rgba(255,152,0,0.3);

        }

        /* BUTTON */

        .otp-card button{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                #b45309,
                #ea580c
            );

            color:white;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;

        }

        .otp-card button:hover{

            transform:translateY(-3px);

            box-shadow:0 10px 25px rgba(0,0,0,0.2);

        }

        /* MOBILE */

        @media(max-width:500px){

            .otp-card{

                width:90%;

                padding:30px;

            }

        }

    </style>

</head>

<body>

    <div class="otp-container">

        <div class="otp-card">

            <img src="{% static 'logo.png' %}"
                 alt="Temple Logo"
                 class="otp-logo">

            <h2>Verify OTP</h2>

            <p class="otp-text">

                Enter the OTP sent to your mobile number

            </p>

            {% if messages %}

                {% for message in messages %}

                    <p class="error-msg">

                        {{ message }}

                    </p>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="otp"
                       placeholder="Enter OTP"
                       required>

                <button type="submit">

                    Verify OTP

                </button>

            </form>

        </div>

    </div>

</body>
</html>
