{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Srivari Seva Portal</title>

    <link rel="icon"
        type="image/png"
        href="{% static 'logo.png' %}">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            background:
                linear-gradient(rgba(255, 247, 237, 0.88),
                    rgba(255, 247, 237, 0.88)),
                url("{% static 'temple-bg.jpg' %}");

            background-size: cover;

            background-position: center;

            overflow-x: hidden;

            position: relative;

        }

        /* GLOW EFFECTS */

        body::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            background: rgba(249, 115, 22, 0.25);

            border-radius: 50%;

            top: -180px;
            left: -180px;

            filter: blur(120px);

        }

        body::after {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            background: rgba(234, 88, 12, 0.2);

            border-radius: 50%;

            bottom: -180px;
            right: -180px;

            filter: blur(120px);

        }

        /* OTP CONTAINER */

        .otp-container {

            width: 100%;

            max-width: 520px;

            position: relative;

            z-index: 10;

        }

        /* OTP CARD */

        .otp-card {

            background: rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(14px);

            border-radius: 35px;

            padding: 50px 45px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.4);

            overflow: hidden;

            position: relative;

            text-align: center;

        }

        .otp-card::before {

            content: '';

            position: absolute;

            top: -120px;
            right: -120px;

            width: 260px;
            height: 260px;

            background: rgba(249, 115, 22, 0.08);

            border-radius: 50%;

        }

        /* LOGO */

        .otp-logo {

            width: 115px;

            height: 115px;

            object-fit: contain;

            margin-bottom: 20px;

            animation: float 3s ease-in-out infinite;

            position: relative;

            z-index: 2;

        }

        @keyframes float {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }

        }

        /* TITLE */

        .otp-card h2 {

            color: #7c2d12;

            font-size: 36px;

            margin-bottom: 12px;

            font-weight: 700;

            position: relative;

            z-index: 2;

        }

        .otp-text {

            color: #6b7280;

            font-size: 15px;

            line-height: 28px;

            margin-bottom: 30px;

            position: relative;

            z-index: 2;

        }

        /* MESSAGE */

        .error-msg {

            background: #fff1f2;

            color: #dc2626;

            padding: 14px;

            border-radius: 14px;

            margin-bottom: 20px;

            font-size: 14px;

            font-weight: 600;

            border: 1px solid #fecdd3;

            position: relative;

            z-index: 2;

        }

        /* INPUT */

        .otp-input {

            width: 100%;

            padding: 18px;

            border: 2px solid #fed7aa;

            border-radius: 18px;

            outline: none;

            font-size: 18px;

            text-align: center;

            letter-spacing: 5px;

            background: rgba(255, 255, 255, 0.9);

            color: #111827;

            transition: 0.3s;

            margin-bottom: 25px;

            position: relative;

            z-index: 2;

        }

        .otp-input:focus {

            border-color: #f97316;

            box-shadow: 0 0 0 5px rgba(249, 115, 22, 0.12);

        }

        /* BUTTON */

        .verify-btn {

            width: 100%;

            border: none;

            padding: 17px;

            border-radius: 18px;

            background: linear-gradient(135deg,
                    #f97316,
                    #ea580c);

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.35s ease;

            box-shadow: 0 15px 25px rgba(249, 115, 22, 0.25);

            position: relative;

            z-index: 2;

        }

        .verify-btn:hover {

            transform: translateY(-4px);

            box-shadow: 0 18px 35px rgba(249, 115, 22, 0.35);

        }

        /* FOOTER */

        .otp-footer {

            margin-top: 28px;

            color: #6b7280;

            font-size: 14px;

            position: relative;

            z-index: 2;

        }

        .otp-footer span {

            color: #ea580c;

            font-weight: 600;

        }

        /* MOBILE */

        @media(max-width:600px) {

            body {

                padding: 20px;

            }

            .otp-card {

                padding: 38px 25px;

                border-radius: 28px;

            }

            .otp-card h2 {

                font-size: 30px;

            }

            .otp-logo {

                width: 95px;
                height: 95px;

            }

            .otp-input {

                font-size: 16px;

                letter-spacing: 3px;

            }

        }
    </style>

</head>

<body>

    <div class="otp-container">

        <div class="otp-card">

            <img src="{% static 'logo.png' %}"
                alt="Temple Logo"
                class="otp-logo">

            <h2>Verify OTP</h2>

            <p class="otp-text">

                Enter the OTP sent to your registered
                mobile number to continue securely.

            </p>

            {% if messages %}

            {% for message in messages %}

            <div class="error-msg">

                {{ message }}

            </div>

            {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                    name="otp"
                    class="otp-input"
                    placeholder="Enter OTP"
                    maxlength="6"
                    required>

                <button type="submit"
                    class="verify-btn">

                    Verify OTP

                </button>

            </form>

            <div class="otp-footer">

                Powered by <span>Srivari Seva Portal</span>

            </div>

        </div>

    </div>

</body>

</html>
