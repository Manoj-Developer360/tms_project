{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Seva Booking - Srivari Seva Portal</title>

    <link rel="icon"
          type="image/png"
          href="{% static 'logo.png' %}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:linear-gradient(
                135deg,
                #fff5e6,
                #ffe0b3
            );

            min-height:100vh;

        }

        /* NAVBAR */

        nav{

            width:100%;

            background:white;

            padding:15px 50px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            box-shadow:0 5px 20px rgba(0,0,0,0.08);

        }

        .logo-section{

            display:flex;

            align-items:center;

            gap:15px;

        }

        .logo-section img{

            width:70px;
            height:70px;

        }

        .logo-section h2{

            color:#8b2500;

            font-size:28px;

        }

        .logo-section p{

            color:#666;

            font-size:14px;

        }

        .back-btn{

            text-decoration:none;

            background:#ea580c;

            color:white;

            padding:12px 20px;

            border-radius:12px;

            font-size:15px;

            transition:0.3s;

        }

        .back-btn:hover{

            background:#c2410c;

        }

        /* MAIN */

        .main-container{

            width:100%;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:50px 20px;

        }

        .booking-box{

            width:100%;

            max-width:550px;

            background:white;

            padding:40px;

            border-radius:30px;

            box-shadow:0 20px 50px rgba(0,0,0,0.1);

        }

        .booking-box img{

            width:120px;

            display:block;

            margin:auto;

            margin-bottom:20px;

        }

        .booking-box h1{

            text-align:center;

            color:#9a3412;

            margin-bottom:10px;

        }

        .booking-box p{

            text-align:center;

            color:#666;

            margin-bottom:30px;

        }

        /* FORM */

        form{

            width:100%;

        }

        .input-box{

            margin-bottom:20px;

        }

        .input-box label{

            display:block;

            margin-bottom:8px;

            color:#444;

            font-weight:600;

        }

        .input-box input,
        .input-box select{

            width:100%;

            padding:15px;

            border-radius:14px;

            border:2px solid #fed7aa;

            outline:none;

            font-size:15px;

            transition:0.3s;

            background:white;

        }

        .input-box input:focus,
        .input-box select:focus{

            border-color:#ea580c;

            box-shadow:0 0 10px rgba(234,88,12,0.2);

        }

        /* BUTTON */

        .submit-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:linear-gradient(
                135deg,
                #ea580c,
                #c2410c
            );

            color:white;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;

        }

        .submit-btn:hover{

            transform:translateY(-3px);

            box-shadow:0 10px 25px rgba(0,0,0,0.15);

        }

        /* MESSAGE */

        .message{

            background:#ecfdf5;

            color:#166534;

            padding:14px;

            border-radius:12px;

            margin-bottom:20px;

            text-align:center;

            font-weight:600;

        }

        /* MOBILE */

        @media(max-width:768px){

            nav{

                padding:15px 20px;

                flex-direction:column;

                gap:15px;

            }

            .logo-section{

                flex-direction:column;

                text-align:center;

            }

            .booking-box{

                padding:25px;

            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo-section">

            <img src="{% static 'logo.png' %}"
                 alt="Temple Logo">

            <div>

                <h2>

                    Srivari Seva Portal

                </h2>

                <p>

                    Online Darshan & Temple Services

                </p>

            </div>

        </div>

        <a href="{% url 'home' %}"
           class="back-btn">

            ← Back To Home

        </a>

    </nav>

    <!-- MAIN CONTENT -->

    <div class="main-container">

        <div class="booking-box">

            <img src="{% static 'logo.png' %}"
                 alt="Temple Logo">

            <h1>

                Seva Booking

            </h1>

            <p>

                Book temple seva online with your preferred timing

            </p>

            <!-- MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}

                <div class="input-box">

                    <label>

                        Full Name

                    </label>

                    <input type="text"
                           name="full_name"
                           placeholder="Enter Full Name"
                           required>

                </div>

                <div class="input-box">

                    <label>

                        Mobile Number

                    </label>

                    <input type="text"
                           name="mobile"
                           placeholder="Enter Mobile Number"
                           maxlength="10"
                           required>

                </div>

                <div class="input-box">

                    <label>

                        Select Seva

                    </label>

                    <select name="seva_name" required>

                        <option value="">

                            Select Seva

                        </option>

                        <option>

                            Suprabhata Seva

                        </option>

                        <option>

                            Archana

                        </option>

                        <option>

                            Kalyanotsavam

                        </option>

                        <option>

                            Thomala Seva

                        </option>

                    </select>

                </div>

                <div class="input-box">

                    <label>

                        Select Seva Time

                    </label>

                    <select name="seva_time" required>

                        <option value="">

                            Select Time

                        </option>

                        <option>

                            6AM

                        </option>

                        <option>

                            9AM

                        </option>

                        <option>

                            12PM

                        </option>

                        <option>

                            6PM

                        </option>

                    </select>

                </div>

                <div class="input-box">

                    <label>

                        Select Seva Date

                    </label>

                    <input type="date"
                           name="seva_date"
                           required>

                </div>

                <button type="submit"
                        class="submit-btn">

                    Book Seva

                </button>

            </form>

        </div>

    </div>

</body>

</html>
